name: DIAG ddk (sync-only, throwaway)

on:
  workflow_dispatch:

env:
  KMI_BRANCH: common-android15-6.6
  KMI_TAG: android15-6.6.127_r00

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git curl python3
          mkdir -p "$HOME/bin"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name ci; git config --global user.email ci@local

      - name: Sync manifest
        run: |
          mkdir -p ws && cd ws
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b ${{ env.KMI_BRANCH }} -m default.xml
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle --fail-fast

      - name: Pin common
        run: |
          cd ws/common
          git fetch https://android.googlesource.com/kernel/common.git tag ${{ env.KMI_TAG }} --depth=1
          git checkout ${{ env.KMI_TAG }}

      - name: Inspect ddk + headers setup
        run: |
          cd ws
          echo "=== compiler-version.h exists in source? ==="
          ls -l common/include/linux/compiler-version.h || echo "MISSING in source"
          echo ""
          echo "=== ddk_module exported from kernel.bzl? ==="
          grep -rn "ddk_module" build/kernel/kleaf/kernel.bzl | head
          echo ""
          echo "=== headers / all_headers / ddk targets in common/BUILD.bazel ==="
          grep -nE "all_headers|ddk_headers|kernel_build\(|name = \"kernel_aarch64\"|name = \"kernel_aarch64_headers\"|ddk_" common/BUILD.bazel | head -40
          echo ""
          echo "=== any ddk_module examples shipped in tree (the canonical form) ==="
          grep -rln "ddk_module(" --include=BUILD.bazel . 2>/dev/null | head
          echo "--- first example body ---"
          F=$(grep -rln "ddk_module(" --include=BUILD.bazel . 2>/dev/null | head -1)
          [ -n "$F" ] && { echo "FILE: $F"; sed -n '/ddk_module(/,/^)/p' "$F" | head -40; }
          echo ""
          echo "=== ddk docs / how kernel_build exposes ddk headers ==="
          grep -rln "ddk_module\|DdkHeaders" build/kernel/kleaf/*.bzl build/kernel/kleaf/impl/*.bzl 2>/dev/null | head
          echo ""
          echo "=== does kernel_aarch64 kernel_build set ddk_module_headers / module_outputs ? ==="
          sed -n '/kernel_build(/,/^)/p' common/BUILD.bazel | grep -nE "ddk|headers|module|name =" | head -30