name: Build rodin_testmem module (fast)

on:
  push:
    paths:
      - 'rodin_testmem/**'
      - '.github/workflows/build-module-testmem.yml'
  workflow_dispatch:

env:
  KMI_TAG: android15-6.6.127_r00

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute kernel cache key
        run: |
          H=$(cat .github/workflows/build-kernel.yml \
                  configs/*.fragment \
                  rodin/* \
                  patches/* 2>/dev/null | sha256sum | cut -c1-16)
          KEY="kernel-${KMI_TAG}-${H}"
          echo "CACHE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "[+] cache key = $KEY"

      - name: Restore bazel cache + ws tree
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel
            ws
          key: ${{ env.CACHE_KEY }}

      - name: Guard — cache must be present
        run: |
          if [ "${{ steps.restore.outputs.cache-hit }}" != "true" ]; then
            echo "[FAIL] cache miss para key=${CACHE_KEY}."
            exit 1
          fi
          test -x ws/tools/bazel || { echo "[FAIL] ws/tools/bazel ausente"; exit 1; }
          echo "[+] cache restaurado, ws/ presente"

      - name: Build rodin_testmem.ko (kernel já em cache)
        run: |
          cd ws
          mkdir -p common/rodin_testmem
          cp "$GITHUB_WORKSPACE/rodin_testmem/rodin_testmem.c" common/rodin_testmem/
          cp "$GITHUB_WORKSPACE/rodin_testmem/BUILD.bazel"     common/rodin_testmem/
          tools/bazel build --lto=thin --page_size=4k \
            --defconfig_fragment=//common:arch/arm64/configs/revenant.fragment \
            //common/rodin_testmem:rodin_testmem
          mkdir -p "$GITHUB_WORKSPACE/dist"
          KO=$(find -L bazel-bin -name rodin_testmem.ko | head -1)
          test -n "$KO"
          cp -v "$KO" "$GITHUB_WORKSPACE/dist/rodin_testmem.ko"

      - name: Gates (vermagic + GOT)
        run: |
          KO="$GITHUB_WORKSPACE/dist/rodin_testmem.ko"
          strings "$KO" | grep -iE "vermagic|^name=|^depends=" | head
          if readelf -r "$KO" 2>/dev/null | grep -iE "GOT"; then
            echo "[FAIL] GOT relocations presentes"
            exit 1
          fi
          echo "[+] sem GOT — loader-compativel"

      - name: Upload rodin_testmem.ko
        uses: actions/upload-artifact@v4
        with:
          name: rodin_testmem-ko-${{ github.run_number }}
          path: dist/rodin_testmem.ko
          retention-days: 30
