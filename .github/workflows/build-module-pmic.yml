name: Build rodin_pmic_dbg module (fast)

# Workflow espelho de build-module.yml e build-module-uv.yml pra
# o rodin_pmic_dbg. Restaura o mesmo cache do kernel (workflow A em
# main) e builda só o .ko em ~1min.
on:
  push:
    paths:
      - 'rodin_pmic_dbg/**'
      - '.github/workflows/build-module-pmic.yml'
  workflow_dispatch:

env:
  KMI_TAG: android15-6.6.127_r00

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute kernel cache key
        run: |
          H=$(cat .github/workflows/build-kernel.yml \
                  configs/*.fragment \
                  rodin/* \
                  patches/* 2>/dev/null | sha256sum | cut -c1-16)
          KEY="kernel-${KMI_TAG}-${H}"
          echo "CACHE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "[+] cache key = $KEY"

      - name: Restore bazel cache + ws tree
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel
            ws
          key: ${{ env.CACHE_KEY }}

      - name: Guard — cache must be present
        run: |
          if [ "${{ steps.restore.outputs.cache-hit }}" != "true" ]; then
            echo "[FAIL] cache miss para key=${CACHE_KEY}."
            echo "       Rode a workflow A (Build Revenant Kernel) na main primeiro"
            echo "       pra popular o cache, depois re-push."
            exit 1
          fi
          test -x ws/tools/bazel || { echo "[FAIL] ws/tools/bazel ausente — cache corrompido"; exit 1; }
          echo "[+] cache restaurado, ws/ presente"

      - name: Build rodin_pmic_dbg.ko (kernel já em cache)
        run: |
          cd ws
          mkdir -p common/rodin_pmic_dbg
          cp "$GITHUB_WORKSPACE/rodin_pmic_dbg/rodin_pmic_dbg.c" common/rodin_pmic_dbg/
          cp "$GITHUB_WORKSPACE/rodin_pmic_dbg/BUILD.bazel"      common/rodin_pmic_dbg/
          tools/bazel build --lto=thin --page_size=4k \
            --defconfig_fragment=//common:arch/arm64/configs/revenant.fragment \
            //common/rodin_pmic_dbg:rodin_pmic_dbg
          mkdir -p "$GITHUB_WORKSPACE/dist"
          KO=$(find -L bazel-bin -name rodin_pmic_dbg.ko | head -1)
          test -n "$KO"
          cp -v "$KO" "$GITHUB_WORKSPACE/dist/rodin_pmic_dbg.ko"

      - name: Gates (vermagic + GOT + undefined syms)
        run: |
          KO="$GITHUB_WORKSPACE/dist/rodin_pmic_dbg.ko"
          echo "=== info ==="
          strings "$KO" | grep -iE "vermagic|^name=|^depends=|mtk-spmi-pmic-debug" | head
          echo "=== GOT reloc gate ==="
          if readelf -r "$KO" 2>/dev/null | grep -iE "GOT"; then
            echo "[FAIL] GOT relocations presentes — insmod rejeitaria"
            exit 1
          fi
          echo "[+] sem GOT — loader-compatível"
          echo "=== undefined syms (esperado: regmap/spmi/platform/sysfs do core kernel) ==="
          readelf -sW "$KO" 2>/dev/null \
            | grep -iE "regmap_read|regmap_write|dev_get_regmap|platform_driver|device_create_file"

      - name: Upload rodin_pmic_dbg.ko
        uses: actions/upload-artifact@v4
        with:
          name: rodin_pmic_dbg-ko-${{ github.run_number }}
          path: dist/rodin_pmic_dbg.ko
          retention-days: 30
