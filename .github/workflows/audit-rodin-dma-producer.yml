name: Compile disposable DMA producer (not flashable)

on:
  workflow_dispatch:
  push:
    branches: [dyperos-3.0.304]
    paths:
      - .github/workflows/audit-rodin-dma-producer.yml
      - scripts/prepare-dmabuf-runtime-audit.py
      - scripts/test-dmabuf-runtime-producer-source.py
      - scripts/test-dmabuf-exporter-source.py
      - scripts/prepare-dmabuf-fault-sites.py
      - scripts/test-dmabuf-fault-sites.py
      - scripts/test-dmabuf-folded-levels.py
      - scripts/prepare-dmabuf-reimplementation.py
      - tools/stock-recovery/overlays/dma-6.6.77/**
      - scripts/test-dmabuf-audit-fault-plan.py
      - scripts/test-dmabuf-audit-log-formats.py
      - scripts/test-dmabuf-runtime-integration.py
      - scripts/prepare-dmabuf-address-overlay.py
      - scripts/extract-dmabuf-address-selector.py
      - scripts/test-dmabuf-address-overlay.py
      - scripts/check-dmabuf-address-build.py
      - scripts/test-dmabuf-address-build.py
      - tools/stock-recovery/dmabuf_huge_address.recovered.c
      - scripts/run-dmabuf-vm-audit.py
      - scripts/test-dmabuf-vm-runner.py
      - scripts/build-dmabuf-vm-initramfs.py
      - tools/stock-recovery/runtime-audit/guest-init.c
      - tools/stock-recovery/runtime-audit/guest-workload.c
      - tools/stock-recovery/runtime-audit/audit-data.h
      - tools/stock-recovery/runtime-audit/recovered-dma-audit.c
      - tools/stock-recovery/runtime-audit/recovered-dma-export-audit.c
      - tools/stock-recovery/runtime-audit/audit-export-contract.h
      - tools/stock-recovery/runtime-audit/audit-map-contract.h
      - tools/stock-recovery/runtime-audit/audit-fault-plan.h
      - tools/stock-recovery/runtime-audit/test_audit_fault_plan.c
      - tools/stock-recovery/runtime-audit/Kconfig
      - tools/stock-recovery/runtime-audit/Makefile

permissions:
  contents: read

concurrency:
  group: rodin-dma-${{ github.ref }}
  cancel-in-progress: false

env:
  KMI_BRANCH: common-android15-6.6
  KMI_TAG: android15-6.6.77_r00
  KMI_TAG_OBJECT: 79d26ca363880c3c6f7841045e46427bee6c3c3b
  KMI_COMMIT: f7ebe251035c0d15ff90c6a0a320697932785fad

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: enabled
            enabled: 'y'
    steps:
      - uses: actions/checkout@v4
      - name: Validate audit gates
        run: |
          set -euo pipefail
          python3 scripts/test-dmabuf-build-gates.py
          python3 -m py_compile scripts/prepare-dmabuf-reimplementation.py \
            scripts/validate-dmabuf-overlay.py scripts/check-dmabuf-build.py
      - name: Install build dependencies
        run: |
          set -euo pipefail
          while IFS= read -r apt_source; do
            sudo rm -f "$apt_source"
          done < <(sudo grep -RIl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d || true)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates clang curl flex git libelf-dev \
            libssl-dev lz4 python3 python3-pyelftools rsync xz-utils zip zstd
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --retry 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned ACK
        run: |
          set -euo pipefail
          mkdir ws
          cd ws
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b "$KMI_BRANCH" -m default.xml
          repo sync -c -j2 --no-tags --no-clone-bundle --fail-fast
          git -C common fetch https://android.googlesource.com/kernel/common.git \
            "refs/tags/$KMI_TAG:refs/tags/$KMI_TAG" --depth=1
          test "$(git -C common rev-parse "refs/tags/$KMI_TAG")" = "$KMI_TAG_OBJECT"
          git -C common checkout --detach "$KMI_TAG"
          test "$(git -C common rev-parse HEAD)" = "$KMI_COMMIT"
      - name: Apply exact review overlay and disposable producer
        run: |
          set -euo pipefail
          mkdir runtime-reference
          for source_path in mm/mmap.c mm/mremap.c mm/Kconfig mm/Makefile \
            include/linux/huge_mm.h include/linux/mm.h include/linux/mm_types.h \
            include/linux/pgtable.h arch/arm64/include/asm/pgtable.h \
            mm/memory.c mm/huge_memory.c; do
            mkdir -p "runtime-reference/$(dirname "$source_path")"
            cp "ws/common/$source_path" "runtime-reference/$source_path"
          done
          python3 scripts/test-dmabuf-runtime-producer-source.py
          python3 scripts/test-dmabuf-exporter-source.py
          python3 scripts/test-dmabuf-audit-fault-plan.py
          python3 scripts/test-dmabuf-audit-log-formats.py
          DMA_FOLDED_ACK_SOURCE="$GITHUB_WORKSPACE/ws/common" \
            python3 scripts/test-dmabuf-folded-levels.py
          DMA_ACK_REFERENCE="$GITHUB_WORKSPACE/runtime-reference" \
            python3 scripts/test-dmabuf-fault-sites.py
          DMA_ACK_REFERENCE="$GITHUB_WORKSPACE/runtime-reference" \
            python3 scripts/test-dmabuf-runtime-integration.py
          python3 scripts/validate-dmabuf-overlay.py --source ws/common \
            --overlay tools/stock-recovery/overlays/dma-6.6.77 --apply-review
          cp "tools/stock-recovery/overlays/dma-6.6.77/${{ matrix.profile }}.fragment" \
            ws/common/arch/arm64/configs/dma_audit.fragment
          mkdir -p dma-evidence
          python3 scripts/prepare-dmabuf-runtime-audit.py --source ws/common \
            --ack-reference runtime-reference --apply-review \
            --output dma-evidence/runtime-producer-source.json
          python3 scripts/test-dmabuf-address-overlay.py
          python3 scripts/test-dmabuf-address-build.py
          python3 scripts/prepare-dmabuf-address-overlay.py \
            --core ws/common/drivers/dma-buf/dma-buf.c --output runtime-address
          git -C ws/common apply --check \
            "$GITHUB_WORKSPACE/runtime-address/dmabuf-address-review.patch"
          git -C ws/common apply \
            "$GITHUB_WORKSPACE/runtime-address/dmabuf-address-review.patch"
          cp runtime-address/manifest.json dma-evidence/address-overlay-manifest.json
          ws/common/scripts/config --file ws/common/arch/arm64/configs/dma_audit.fragment \
            --enable XIAOMI_DMABUF_RUNTIME_AUDIT
          ws/common/scripts/config --file ws/common/arch/arm64/configs/dma_audit.fragment \
            --enable DMA_SHARED_BUFFER
      - name: Compile audit kernel
        run: |
          set -euo pipefail
          cd ws
          tools/bazel build --lto=none --page_size=4k \
            --defconfig_fragment=//common:arch/arm64/configs/dma_audit.fragment \
            //common:kernel_aarch64_dist 2>&1 | tee "$GITHUB_WORKSPACE/dma-build.log"
      - name: Check compiled providers
        run: |
          set -euo pipefail
          mkdir -p dma-evidence
          mapfile -t binaries < <(find -L ws/bazel-bin -type f -name vmlinux -path '*kernel_aarch64*')
          test "${#binaries[@]}" -ge 1
          mapfile -t configs < <(find -L ws/bazel-bin -type f -name '*.config' -path '*kernel_aarch64*')
          test "${#configs[@]}" -ge 1
          python3 scripts/check-dmabuf-build.py --vmlinux "${binaries[@]}" \
            --config "${configs[@]}" --enabled '${{ matrix.enabled }}' \
            --output dma-evidence/providers.json
          python3 scripts/check-dmabuf-address-build.py --vmlinux "${binaries[0]}" \
            --output dma-evidence/address-selector-elf.json
          grep -x 'CONFIG_XIAOMI_DMABUF_RUNTIME_AUDIT=y' "${configs[0]}"
          python3 - "${binaries[0]}" <<'PY'
          import json, sys
          from elftools.elf.elffile import ELFFile
          with open(sys.argv[1], 'rb') as stream:
              elf = ELFFile(stream)
              symbols = list(elf.get_section_by_name('.symtab').iter_symbols())
              evidence = {}
              for name in ('audit_fops', 'audit_pmd_device', 'audit_pte_device',
                           'audit_fault_pmd_device', 'audit_fault_pte_device',
                           'audit_first_pmd_device', 'audit_first_pte_device',
                           'audit_table_pmd_device', 'audit_table_pte_device',
                           'dma_export_audit_ops', 'dma_export_audit_factory_fops', 'dma_export_audit_device'):
                  matches = [s for s in symbols if s.name == name and s['st_shndx'] != 'SHN_UNDEF']
                  if len(matches) != 1 or matches[0]['st_info']['type'] != 'STT_OBJECT' or not matches[0]['st_size']:
                      raise SystemExit('missing/ambiguous built-in producer object: ' + name)
                  evidence[name] = {'size': matches[0]['st_size'], 'address': matches[0]['st_value']}
              matches = [s for s in symbols if s.name == 'recovered_dma_audit_fail_alloc' and s['st_shndx'] != 'SHN_UNDEF']
              if len(matches) != 1 or matches[0]['st_info']['type'] != 'STT_FUNC' or not matches[0]['st_size']:
                  raise SystemExit('missing/ambiguous linked audit allocation callback')
              evidence['recovered_dma_audit_fail_alloc'] = {'size': matches[0]['st_size'], 'address': matches[0]['st_value']}
              for name in ('dma_export_audit_mmap', 'dma_export_audit_release', 'dma_export_audit_ioctl', 'recovered_dma_audit_plain_remap', 'recovered_dma_audit_fail_pmd_table'):
                  matches = [s for s in symbols if s.name == name and s['st_shndx'] != 'SHN_UNDEF']
                  if len(matches) != 1 or matches[0]['st_info']['type'] != 'STT_FUNC' or not matches[0]['st_size']:
                      raise SystemExit('missing/ambiguous linked exporter function: ' + name)
                  evidence[name] = {'size': matches[0]['st_size'], 'address': matches[0]['st_value']}
          with open('dma-evidence/runtime-producer-elf.json', 'x') as output:
              json.dump({'status': 'COMPILE_LINK_ONLY_NOT_RUNTIME', 'objects': evidence}, output, indent=2)
          PY
          cp "${configs[0]}" dma-evidence/config
          cp tools/stock-recovery/overlays/dma-6.6.77/manifest.json dma-evidence/overlay-manifest.json
          git -C ws/common diff --stat > dma-evidence/source-diff-stat.txt
          repo_manifest=ws/.repo/manifests
          git -C "$repo_manifest" rev-parse HEAD > dma-evidence/build-manifest-commit.txt
      - name: Run RAM-only ARM64 QEMU audit
        run: |
          set -euo pipefail
          python3 scripts/test-dmabuf-vm-initramfs.py
          python3 scripts/test-dmabuf-vm-runner.py
          source_dir=tools/stock-recovery/runtime-audit
          aarch64-linux-gnu-gcc -std=c11 -O1 -Wall -Wextra -Werror -pthread -static \
            "$source_dir/guest-workload.c" -o dma-evidence/arm64-guest
          aarch64-linux-gnu-gcc -std=c11 -O1 -Wall -Wextra -Werror -static \
            "$source_dir/guest-init.c" -o dma-evidence/arm64-init
          python3 scripts/build-dmabuf-vm-initramfs.py --init dma-evidence/arm64-init \
            --guest dma-evidence/arm64-guest --output dma-evidence/initramfs.cpio \
            > dma-evidence/initramfs-report.json
          mapfile -t images < <(find -L ws/bazel-bin -type f -name Image -path '*kernel_aarch64*')
          test "${#images[@]}" -ge 1
          for image in "${images[@]}"; do
            cmp "${images[0]}" "$image"
          done
          qemu-system-aarch64 --version > dma-evidence/qemu-version.txt
          aarch64-linux-gnu-gcc --version > dma-evidence/guest-compiler-version.txt
          python3 scripts/run-dmabuf-vm-audit.py --kernel "${images[0]}" \
            --config dma-evidence/config --initramfs dma-evidence/initramfs.cpio \
            --output dma-evidence/vm --timeout 240
          # Do not upload kernel/initramfs/binaries; runtime evidence only below.
      - name: Preserve audit logs (no installer or device operation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dma-producer-compile-${{ github.run_number }}
          path: |
            dma-build.log
            dma-evidence/*.json
            dma-evidence/*.txt
            dma-evidence/config
            dma-evidence/vm/serial.log
            dma-evidence/vm/report.json
          if-no-files-found: warn
