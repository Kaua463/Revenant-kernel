name: Audit rodin 6.6.77 KSUN SUSFS ABI

on:
  workflow_dispatch:
  push:
    branches: [dyperos-3.0.304]
    paths:
      - .github/workflows/audit-rodin-6.6.77-ksun-susfs.yml
      - configs/rodin-6.6.77-ksun-susfs.fragment
      - scripts/integrate-ksun-susfs-6.6.77.sh
      - scripts/validate-ksun-susfs-port.sh
      - scripts/fix-rodin-boot-abi.py
      - scripts/align-rodin-kmi.py
      - scripts/test-rodin-kmi.py
      - configs/rodin-6.6.77-boot-symbols
      - configs/rodin-stock-304-modules.pem
      - scripts/check-stock-module-trust.py
      - scripts/check-stock-kfence.py
      - scripts/test-stock-kfence.py
      - scripts/check-stock-config-alignment.py
      - scripts/test-stock-config-alignment.py
      - scripts/test-module-trust.py
      - scripts/audit-rom-module-abi.py
      - scripts/rom-module-reference.py
      - scripts/package-rodin-orangefox.py
      - configs/rodin-304-module-reference.json
      - packaging/**

permissions:
  contents: read

concurrency:
  group: rodin-6.6.77-ksun-susfs-${{ github.ref }}
  cancel-in-progress: false

env:
  KMI_BRANCH: common-android15-6.6
  KMI_TAG: android15-6.6.77_r00
  KMI_TAG_OBJECT: 79d26ca363880c3c6f7841045e46427bee6c3c3b
  KMI_COMMIT: f7ebe251035c0d15ff90c6a0a320697932785fad
  KSU_COMMIT: 234f6e040fcbca18b16d2398e1aa225712ec99ad
  KSU_GIT_VERSION: '3239'
  KSU_VERSION: '33239'
  KSU_GIT_TAG: v3.3.0
  KSU_V330_COMMIT: 3b18216f71df189ab3d1b1ce0bdb21be1268e771
  KSU_V330_UAPI_TREE: fc98ae0140c80815260ecaf86ddb6ef06ad29863
  KSU_V330_NATIVES_BLOB: 0fafa35dc7d31ef4c8add60c3f8d98a090027544
  SUSFS_COMMIT: be7b7ef49a1e1b189c3abf00eacaa7ebdb4168c1
  SUSFS_FIX_COMMIT: cd63f371d91fb7fc32014c75728fbb9b686d9ae9
  STOCK_SCMVERSION: -gca30f3b4bef6-abogki440974771
  STOCK_KERNEL_RELEASE: 6.6.77-android15-8-gca30f3b4bef6-abogki440974771-4k

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository gates
        run: |
          scripts/validate-ksun-susfs-port.sh
          python3 scripts/test-stock-kfence.py
          python3 scripts/test-stock-config-alignment.py
          python3 scripts/test-rodin-kmi.py
          python3 scripts/check-stock-kfence.py configs/rodin-6.6.77-ksun-susfs.fragment
          python3 scripts/check-stock-config-alignment.py configs/rodin-6.6.77-ksun-susfs.fragment

      - name: Install dependencies
        run: |
          while IFS= read -r apt_source; do
            sudo rm -f "$apt_source"
          done < <(sudo grep -RIl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d || true)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git libelf-dev \
            libssl-dev lz4 patch python3 python3-pyelftools rsync xz-utils zip zstd
          python3 scripts/test-module-trust.py
          python3 -m py_compile scripts/rom-module-reference.py scripts/package-rodin-orangefox.py
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --retry 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Fetch exact ACK and integration sources
        run: |
          mkdir ws
          cd ws
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b "$KMI_BRANCH" -m default.xml
          repo sync -c -j2 --no-tags --no-clone-bundle --fail-fast
          git -C common fetch https://android.googlesource.com/kernel/common.git \
            "refs/tags/$KMI_TAG:refs/tags/$KMI_TAG" --depth=1
          test "$(git -C common rev-parse "refs/tags/$KMI_TAG")" = "$KMI_TAG_OBJECT"
          git -C common checkout --detach "$KMI_TAG"
          test "$(git -C common rev-parse HEAD)" = "$KMI_COMMIT"
          git clone --filter=blob:none https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_COMMIT"
          git -C KernelSU-Next merge-base --is-ancestor "$KSU_V330_COMMIT" "$KSU_COMMIT"
          test "$(git -C KernelSU-Next rev-parse "$KSU_COMMIT:uapi")" = "$KSU_V330_UAPI_TREE"
          test "$(git -C KernelSU-Next rev-parse "$KSU_COMMIT:manager/app/src/main/java/com/rifsxd/ksunext/Natives.kt")" = "$KSU_V330_NATIVES_BLOB"
          grep -q 'const val MINIMAL_SUPPORTED_KERNEL = 33188' \
            KernelSU-Next/manager/app/src/main/java/com/rifsxd/ksunext/Natives.kt
          git clone --filter=blob:none --branch gki-android15-6.6 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          git -C susfs4ksu checkout --detach "$SUSFS_COMMIT"
          git clone --filter=blob:none https://github.com/WildKernels/kernel_patches.git susfs-fixes
          git -C susfs-fixes checkout --detach "$SUSFS_FIX_COMMIT"

      - name: Integrate pinned KernelSU Next and SUSFS
        run: |
          chmod +x scripts/integrate-ksun-susfs-6.6.77.sh
          KERNEL_DIR="$GITHUB_WORKSPACE/ws/common" \
          KSU_DIR="$GITHUB_WORKSPACE/ws/KernelSU-Next" \
          SUSFS_DIR="$GITHUB_WORKSPACE/ws/susfs4ksu" \
          FIX_DIR="$GITHUB_WORKSPACE/ws/susfs-fixes" \
            scripts/integrate-ksun-susfs-6.6.77.sh
          cp configs/rodin-6.6.77-ksun-susfs.fragment \
            ws/common/arch/arm64/configs/revenant_ksun_susfs.fragment
          python3 scripts/fix-rodin-boot-abi.py ws/common
          python3 scripts/align-rodin-kmi.py ws/common
          python3 scripts/check-stock-module-trust.py
          cp configs/rodin-stock-304-modules.pem ws/common/certs/rodin-stock-304-modules.pem

      - name: Pin stock-compatible release metadata
        run: |
          stamp=ws/build/kernel/kleaf/impl/stamp.bzl
          test "$(grep -Fc "stable_scmversion_cmd = \"echo '-maybe-dirty'\"" "$stamp")" -eq 1
          sed -i "s|echo '-maybe-dirty'|echo '$STOCK_SCMVERSION'|" "$stamp"
          test "$(grep -Fc "stable_scmversion_cmd = \"echo '$STOCK_SCMVERSION'\"" "$stamp")" -eq 1

      - name: Build 4K ABI candidate
        run: |
          set -o pipefail
          cd ws
          tools/bazel build --lto=none --page_size=4k \
            --defconfig_fragment=//common:arch/arm64/configs/revenant_ksun_susfs.fragment \
            //common:kernel_aarch64_dist 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          grep -F -- "-- KernelSU-Next version: $KSU_VERSION" "$GITHUB_WORKSPACE/build.log"
          grep -F -- "-- KernelSU-Next tag: $KSU_GIT_TAG" "$GITHUB_WORKSPACE/build.log"
          if grep -Fq -- 'KernelSU-Next version fallback:' "$GITHUB_WORKSPACE/build.log" || \
             grep -Fq -- 'KernelSU-Next tag fallback:' "$GITHUB_WORKSPACE/build.log"; then
            exit 1
          fi

      - name: Collect and validate evidence
        run: |
          mkdir -p dist
          find -L ws/bazel-bin -type f -name Image -path '*kernel_aarch64*' -print -quit \
            | xargs -I{} cp '{}' dist/Image
          find -L ws/bazel-bin -type f -name Module.symvers -path '*kernel_aarch64*' -print -quit \
            | xargs -I{} cp '{}' dist/Module.symvers
          find -L ws/bazel-bin -type f -name '*.config' -path '*kernel_aarch64*' -print -quit \
            | xargs -I{} cp '{}' dist/config
          test -s dist/Image
          test -s dist/Module.symvers
          python3 scripts/check-stock-kfence.py dist/config
          python3 scripts/check-stock-config-alignment.py dist/config
          python3 scripts/check-stock-module-trust.py --image dist/Image
          grep -qx 'CONFIG_SYSTEM_TRUSTED_KEYS="certs/rodin-stock-304-modules.pem"' dist/config
          grep -qx 'CONFIG_MODULE_SIG_PROTECT=y' dist/config
          cp configs/rodin-stock-304-modules.pem dist/rodin-stock-304-modules.pem
          python3 scripts/rom-module-reference.py check --symvers dist/Module.symvers --image dist/Image --config dist/config
          cp configs/rodin-304-module-reference.json dist/rodin-304-module-reference.json
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              '__alloc_pages_bulk': '0x41b1537b',
              '__tracepoint_android_vh_filemap_map_pages_range': '0xf590d26c',
              'bio_crypt_set_ctx': '0xb114f679',
              'blk_crypto_evict_key': '0xac2d25cb',
              'blk_crypto_init_key': '0xf001a432',
              'blk_crypto_start_using_key': '0xc7a37e90',
              'scsi_device_set_state': '0x681b1aa2',
              'scsi_host_busy': '0x9665b881',
          }
          actual = {r.split()[1]: r.split()[0] for r in Path('dist/Module.symvers').read_text().splitlines()}
          errors = {s: (crc, actual.get(s)) for s, crc in expected.items() if actual.get(s) != crc}
          if errors:
              raise SystemExit(f'ROM boot ABI mismatch: {errors}')
          print('All eight ROM boot dependency CRCs match')
          PY
          for symbol in KSU KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT \
            KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME \
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
            grep -qx "CONFIG_${symbol}=y" dist/config
          done
          grep -qx '# CONFIG_KSU_SUSFS_ENABLE_LOG is not set' dist/config
          strings dist/Image | grep -m1 '^Linux version' | tee dist/kernel-banner.txt
          grep -Fq "Linux version $STOCK_KERNEL_RELEASE " dist/kernel-banner.txt
          strings dist/Image | grep -Fx "$KSU_GIT_TAG" | tee dist/ksu-version-tag.txt
          if strings dist/Image | grep -Fxq 'v0.0.1'; then
            exit 1
          fi
          strings dist/Image | grep -m3 -E 'KernelSU|SUSFS' | tee dist/root-feature-strings.txt
          grep -E -- '-- KernelSU-Next (version|tag):' build.log \
            | sort -u > dist/ksu-build-metadata.txt
          {
            echo "KMI_COMMIT=$KMI_COMMIT"
            echo "KSU_COMMIT=$KSU_COMMIT"
            echo "KSU_VERSION=$KSU_VERSION"
            echo "KSU_VERSION_TAG=$KSU_GIT_TAG"
            echo "KSU_MANAGER_COMPAT=v3.3.0-uapi-identical"
            echo "SUSFS_COMMIT=$SUSFS_COMMIT"
            echo "SUSFS_VERSION=v2.2.0"
            echo "SUSFS_FIX_COMMIT=$SUSFS_FIX_COMMIT"
            echo "LTO_MODE=none-stock-alignment"
          } > dist/provenance.txt
          python3 scripts/package-rodin-orangefox.py --dist dist --run-id "$GITHUB_RUN_ID"
          find dist -type f ! -name SHA256SUMS -exec sha256sum {} + \
            | sed 's#  dist/#  #' | sort -k2 > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload candidate ABI evidence
        uses: actions/upload-artifact@v4
        with:
          name: rodin-6.6.77-ksun33239-susfs2.2-abi-${{ github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 14
