name: Audit rodin stock 6.6.77 ABI baseline

on:
  workflow_dispatch:
  push:
    branches: [dyperos-3.0.304]
    paths:
      - .github/workflows/audit-rodin-6.6.77-abi.yml
      - scripts/audit-rom-module-abi.py

permissions:
  contents: read

concurrency:
  group: rodin-6.6.77-abi-${{ github.ref }}
  cancel-in-progress: false

env:
  KMI_BRANCH: common-android15-6.6
  KMI_TAG: android15-6.6.77_r00
  KMI_TAG_OBJECT: 79d26ca363880c3c6f7841045e46427bee6c3c3b
  KMI_COMMIT: f7ebe251035c0d15ff90c6a0a320697932785fad

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          while IFS= read -r apt_source; do
            sudo rm -f "$apt_source"
          done < <(sudo grep -RIl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d || true)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git libelf-dev \
            libssl-dev lz4 python3 rsync xz-utils zip zstd
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --retry 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Fetch ACK build environment and exact common tag
        run: |
          mkdir ws
          cd ws
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b "$KMI_BRANCH" -m default.xml
          repo sync -c -j2 --no-tags --no-clone-bundle --fail-fast
          git -C common fetch https://android.googlesource.com/kernel/common.git \
            "refs/tags/$KMI_TAG:refs/tags/$KMI_TAG" --depth=1
          test "$(git -C common rev-parse "refs/tags/$KMI_TAG")" = "$KMI_TAG_OBJECT"
          git -C common checkout --detach "$KMI_TAG"
          test "$(git -C common rev-parse HEAD)" = "$KMI_COMMIT"
          grep -qx 'KMI_GENERATION=8' common/build.config.common

      - name: Build untouched 4K GKI ABI baseline
        run: |
          cd ws
          tools/bazel build --lto=thin --page_size=4k //common:kernel_aarch64_dist

      - name: Collect ABI evidence
        run: |
          mkdir -p dist
          find -L ws/bazel-bin -type f -name Image -path '*kernel_aarch64*' -print -quit \
            | xargs -I{} cp '{}' dist/Image
          find -L ws/bazel-bin -type f -name Module.symvers -path '*kernel_aarch64*' -print -quit \
            | xargs -I{} cp '{}' dist/Module.symvers
          find -L ws/bazel-bin -type f -name '*.config' -path '*kernel_aarch64*' -print -quit \
            | xargs -I{} cp '{}' dist/config || true
          test -s dist/Image
          test -s dist/Module.symvers
          strings dist/Image | grep -m1 '^Linux version' | tee dist/kernel-banner.txt
          grep -q '6.6.77-android15-8.*-4k' dist/kernel-banner.txt
          grep -qv 'KernelSU' dist/kernel-banner.txt
          {
            echo "KMI_TAG=$KMI_TAG"
            echo "KMI_COMMIT=$(git -C ws/common rev-parse HEAD)"
            echo "MANIFEST_COMMIT=$(git -C ws/.repo/manifests rev-parse HEAD)"
            echo "LTO_MODE=thin-abi-audit"
            echo "MODULE_SYMVERS_LINES=$(wc -l < dist/Module.symvers)"
          } > dist/provenance.txt
          find dist -type f ! -name SHA256SUMS -exec sha256sum {} + \
            | sed 's#  dist/#  #' | sort -k2 > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload baseline ABI evidence
        uses: actions/upload-artifact@v4
        with:
          name: rodin-stock-6.6.77-abi-baseline-${{ github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 14
